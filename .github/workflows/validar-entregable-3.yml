name: Validar proyecto

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2

      - name: Restaurar paquetes del proyecto de escritorio
        run: nuget restore src/CapaDatos/ProgramaConcentracion.sln -NonInteractive

      - name: Compilar solución Release
        run: msbuild src/CapaDatos/ProgramaConcentracion.sln /restore /t:Rebuild /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal

      - name: Verificar que el instalador versionado coincide con Release
        shell: pwsh
        run: ./src/CapaDatos/CapaPresentacion/Installer/ValidarInstalador.ps1 -Zip ./ProgramaConcentracion-Instalador.zip -PortableZip ./ProgramaConcentracion-Portatil.zip -Executable ./src/CapaDatos/CapaPresentacion/bin/Release/ProgramaConcentracion.exe

      - name: Ejecutar pruebas del Backend (repositorios falsos; sin SMTP ni SQL remoto)
        run: dotnet run --project src/CapaDatos/Backend.Tests/Backend.Tests.csproj --configuration Release --no-build

      - name: Compilar pruebas WinForms
        run: msbuild tests/Pruebas.csproj /restore /t:Rebuild /p:Configuration=Release /verbosity:minimal

      - name: Ejecutar pruebas de reglas y validación del cliente
        run: .\tests\bin\Release\Pruebas.exe

      - name: Ejecutar pruebas de interfaz WinForms
        run: .\tests\bin\Release\Pruebas.exe --interfaz
