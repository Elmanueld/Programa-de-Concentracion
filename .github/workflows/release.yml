name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore src/CapaDatos/ProgramaConcentracion.sln

      - name: Stamp application version from tag
        shell: pwsh
        run: |
          $versionText = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($versionText -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Release tag must look like v1.2.3 or v1.2.3.4."
          }
          if (($versionText.Split('.')).Count -eq 3) { $versionText += '.0' }
          $path = 'src/CapaDatos/CapaPresentacion/Properties/AssemblyInfo.cs'
          $source = Get-Content -LiteralPath $path -Raw
          $assemblyVersionLine = '[assembly: AssemblyVersion("' + $versionText + '")]'
          $fileVersionLine = '[assembly: AssemblyFileVersion("' + $versionText + '")]'
          $informationalLine = '[assembly: AssemblyInformationalVersion("' + $versionText + '")]'
          $source = [regex]::Replace($source, '(?m)^\[assembly: AssemblyVersion\("[^"]+"\)\]$', $assemblyVersionLine)
          $source = [regex]::Replace($source, '(?m)^\[assembly: AssemblyFileVersion\("[^"]+"\)\]$', $fileVersionLine)
          $source = [regex]::Replace($source, '(?m)^\[assembly: AssemblyInformationalVersion\("[^"]+"\)\]\r?\n?', '')
          $source = $source.TrimEnd() + "`r`n" + $informationalLine + "`r`n"
          Set-Content -LiteralPath $path -Value $source -NoNewline -Encoding UTF8

      - name: Build Release installer
        run: msbuild src/CapaDatos/ProgramaConcentracion.sln /t:Build /p:Configuration=Release /restore /m /verbosity:minimal

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Programa de Concentración ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ProgramaConcentracion-Instalador.zip
            ProgramaConcentracion-Portatil.zip
