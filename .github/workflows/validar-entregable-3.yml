name: Validar proyecto

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2

      - name: Restaurar paquetes NuGet
        run: nuget restore src/CapaDatos/CapaDatos.sln -NonInteractive

      - name: Compilar aplicación
        run: msbuild src/CapaDatos/CapaDatos.sln /t:Rebuild /p:Configuration=Release /verbosity:minimal

      - name: Compilar pruebas
        run: msbuild tests/Pruebas.csproj /t:Rebuild /p:Configuration=Release /verbosity:minimal

      - name: Pruebas unitarias
        run: .\tests\bin\Release\Pruebas.exe

      - name: Pruebas de interfaz
        run: .\tests\bin\Release\Pruebas.exe --interfaz

      - name: Preparar instancia LocalDB aislada
        shell: powershell
        run: .\tests\PrepararPruebas.ps1

      - name: Pruebas de integración SQL y SMTP local
        run: .\tests\bin\Release\Pruebas.exe --integracion
